[Warnings]

# Every hit is a member reached through a property the shell itself declares as
# QtObject — Ui/Panel.qml's `property QtObject bar`, Commons/Style.qml's
# `readonly property QtObject font`. qmllint resolves the singletons fine; it
# just cannot see inside a QtObject-typed namespace, so `bar.foreground` and
# `Style.font.caption` both read as missing. Neither the declarations nor the
# call sites are ours to change.
#
# The cost of turning it off rather than filtering it: missing-property no
# longer checks this plugin's own typed properties either, so a typo in a
# ForgeRow binding goes unreported. Delete this line to get that back, at 20
# lines of unactionable output per run.
MissingProperty=disable

# Process.exited hands its handler a QProcess::ExitStatus, which has no QML
# type for qmllint to find. Same interop gap, and equally not ours.
BadSignalHandlerParameters=disable
